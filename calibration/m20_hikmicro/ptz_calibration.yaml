# M20 PTZ camera calibration: everything the gauge-recognition and thermal pipe-detection pipelines need.
# Read README.md in this folder first. Lengths in metres, angles in degrees unless said otherwise.
camera: HIKMICRO HM-TD5767T-7 (optical 2688x1520, zoom 1-25x; thermal 640x512 radiometric), on an M20
calibrated: 2026-11-16      # camera-LiDAR (FAST-Calib, 5 board scenes); optical-thermal + zoom: 2026-11-10
valid_for: this camera unit as mounted on this robot; redo after remounting or replacing the camera

frames:
  base_link: x forward, y left, z up (the robot's TF)
  camera: optical frame, x right, y down, z forward
  gimbal: Lumen's angles, yaw + = right, pitch + = up, zoom in x (= ISAPI absoluteZoom / 10)

# ---- 1. Gimbal: what the head's angles mean on the robot --------------------------------------------
gimbal:
  # with the head at Lumen yaw 0 / pitch 0 the optical axis really points:
  zero_error: {yaw_right: 1.34, pitch_up: -1.61}
  # camera rotation in base_link at gimbal (0, 0): columns = camera x, y, z axes
  R_mount: [[-0.024014, -0.027523, 0.999333], [-0.999502, 0.021156, -0.023435], [-0.020497, -0.999397, -0.028017]]
  pivot: [-0.0260, 0.1219, 0.3369]        # base_link: the point the head turns about (use this as the camera's position for aiming)
  lens_ahead: 0.072                          # the optical centre sits this far ahead of the pivot along the optical axis, at 1x
  # camera pose at any gimbal angle:
  #   R_base_cam(yaw, pitch) = Rz(-yaw) * Ry(-pitch) * R_mount
  #   t_base_cam(yaw, pitch) = pivot + lens_ahead * (third column of R_base_cam)

# ---- 2. What to set on the robot ------------------------------------------------------------------
orchestrator_ptz_extrinsics:   # POST /ptz/extrinsics/set (file config/m20_ptz_extrinsics.json): used to aim at map targets
  {x: -0.026, y: 0.122, z: 0.337, yaw_sign: -1, yaw_offset_deg: -1.34, pitch_offset_deg: -1.61}
lumen_env:                     # alternative to the two offsets above (never both): Lumen's own zero
  LUMEN_GIMBAL_FORWARD_AZIMUTH: 358.7
  LUMEN_GIMBAL_LEVEL_ELEVATION: 1.6
  LUMEN_GAUGE_HFOV: 54.5       # horizontal field of view at 1x (independent of the choice above)

# ---- 3. LiDAR <-> camera at the calibration pose -----------------------------------------------------
lidar:
  topic: /lidar_points_front
  frame: lidar_front
  T_base_lidar: [[-0.000000, -0.000000, 1.000000, 0.320280], [0.000000, -1.000000, -0.000000, 0.000000], [1.000000, 0.000000, 0.000000, -0.013000], [0.000000, 0.000000, 0.000000, 1.000000]]   # from the robot's TF
calibration_pose: {yaw: 0.0, pitch: -5.0, zoom: 1.0}
T_cam_lidar: [[-0.018326, 0.999501, -0.025709, 0.119338], [-0.993196, -0.021156, -0.114521, 0.305250], [-0.115008, 0.023435, 0.993088, 0.314989], [0.000000, 0.000000, 0.000000, 1.000000]]   # p_cam = T * p_lidar, at the calibration pose only
T_base_cam: [[-0.025709, -0.114521, 0.993088, 0.045494], [-0.999502, 0.021156, -0.023435, 0.120203], [-0.018326, -0.993195, -0.115008, 0.328586], [0.000000, 0.000000, 0.000000, 1.000000]]   # p_base = T * p_cam, at the calibration pose only

# ---- 4. Optical intrinsics (full detail, every zoom, and the thermal camera: stereo_calib.yaml) -------
optical_1x:
  size: [2688, 1520]
  K: [[2608.249457, 0.000000, 1328.023594], [0.000000, 2610.547686, 754.299137], [0.000000, 0.000000, 1.000000]]
  dist: [-0.2396, 0.1696, -0.0008, -0.0003, 0.0000]       # k1 k2 p1 p2 k3 (OpenCV)
  hfov_deg: 54.5
zoom:
  calibrated_levels: {'1.00': {fx: 2608.2, fy: 2610.5, cx: 1328.0, cy: 754.3}, '1.50': {fx: 3365.5, fy: 3368.3, cx: 1327.9, cy: 755.7}, '2.00': {fx: 4326.5, fy: 4329.4, cx: 1299.3, cy: 737.8}, '3.00': {fx: 6562.7, fy: 6552.6, cx: 1221.3, cy: 669.8}}
  magnification: {1: 1.000, 1.5: 1.310, 2: 1.802, 3: 2.603, 4: 3.406, 5: 4.208, 6: 5.044}   # the picture's scale vs 1x: NOT equal to the zoom number
  centre_px: [1336.2068, 767.1203]   # the pixel that stays put while zooming
  measured_range: [1.0, 6.0]     # above 6x the curve is extrapolated

# ---- 5. Accuracy ---------------------------------------------------------------------------------------
accuracy:
  camera_lidar_joint_rmse_m: 0.022        # 5 scenes, 20 hole centres
  repeat_calibration: within 0.6 deg and 4 cm of an independent 3-scene calibration the same day
  leave_one_scene_out: at most 0.85 deg and 2.8 cm change
  other_gimbal_angles_and_zoom: 0.5-0.65 deg (board at 2.2 m; yaw -2..+15, pitch -8..-13, zoom 1x and 1.3x)
  expect: about 0.5 deg in direction (2 cm at 2.5 m), 2-4 cm in the camera's position
  optical_thermal: under 1 thermal pixel (held-out boards 0.18-0.69 px, hot object 0.13-0.35 px at 1x-5x)
